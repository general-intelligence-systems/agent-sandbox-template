apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-cache-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: langchain-coding-agent
spec:
  podTemplate:
    metadata:
      labels:
        app: coding-agent
    spec:
      initContainers:
        - name: model-downloader
          image: langchain-model-downloader:local
          imagePullPolicy: Never
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coding-agent-hf-token
                  key: token
            - name: MODEL_DIR
              value: "/models"
          volumeMounts:
            - name: models-cache
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
      containers:
        - name: agent
          image: langchain-coding-agent:local
          imagePullPolicy: Never
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coding-agent-hf-token
                  key: token
            - name: TRANSFORMERS_CACHE
              value: "/models"
            - name: HF_HOME
              value: "/models"
          stdin: true
          tty: true
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: models-cache
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              ephemeral-storage: "5Gi"
            limits:
              cpu: "6"
              memory: "16Gi"
              ephemeral-storage: "15Gi"
      volumes:
        - name: models-cache
          persistentVolumeClaim:
            claimName: models-cache-pvc
        - name: workspace
          emptyDir: {}
  networkPolicyManagement: Managed

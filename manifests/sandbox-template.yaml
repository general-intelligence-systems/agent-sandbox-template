apiVersion: agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: default
spec:
  podTemplate:
    spec:
      containers:
        - name: agent
          image: agent-sandbox:local
          imagePullPolicy: Never
          command: ["python", "/app/main.py"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: agent-code
              mountPath: /etc/agent
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: agent-code
          configMap:
            name: agent-code
  networkPolicyManagement: Managed

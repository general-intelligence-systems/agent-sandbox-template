apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  config.yaml: |
    # Agent configuration -- mounted at /etc/agent/config.yaml
    # Add your own key-value pairs here. The agent loads these on startup
    # and exposes them via GET /config.
    model: gpt-4
    max_tokens: 4096
    temperature: 0.7

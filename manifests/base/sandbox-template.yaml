apiVersion: agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: default
spec:
  podTemplate:
    spec:
      containers:
        - name: agent
          image: agent-sandbox:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/agent/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: secrets
              mountPath: /etc/agent/secrets
              readOnly: true
            - name: scripts
              mountPath: /etc/agent/scripts
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: agent-config
        - name: secrets
          secret:
            secretName: agent-secrets
        - name: scripts
          configMap:
            name: agent-scripts
            defaultMode: 0755
  networkPolicyManagement: Managed

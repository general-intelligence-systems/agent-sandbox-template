apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
type: Opaque
stringData:
  # Secrets mounted at /etc/agent/secrets/<key>
  # Each key becomes a file. The agent injects these as env vars when
  # running commands via POST /exec or POST /run/<script>.
  OPENAI_API_KEY: "<your-openai-api-key>"
  ANTHROPIC_API_KEY: "<your-anthropic-api-key>"

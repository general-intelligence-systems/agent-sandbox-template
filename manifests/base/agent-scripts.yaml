apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-scripts
data:
  # Scripts mounted at /etc/agent/scripts/ and runnable via POST /run/<name>
  hello.sh: |
    #!/usr/bin/env bash
    echo "Hello from the sandbox agent!"
    echo "Config is at: ${AGENT_CONFIG_PATH:-/etc/agent/config.yaml}"

  setup-tools.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    echo "Installing tools..."
    # Example: pip install additional packages at runtime
    # pip install --quiet some-package
    echo "Tools ready."
